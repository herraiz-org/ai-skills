name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; nothing here publishes or writes.
permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # shellcheck ships with the ubuntu-latest image; install it only if that
      # ever stops being true, so `make lint-shell` never silently degrades to
      # its `bash -n` fallback in CI.
      - name: Ensure shellcheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Run linting, metadata validation, and tests
        run: make build
